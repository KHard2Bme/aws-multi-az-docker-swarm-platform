version: "3.8"

services:
  apache:
    image: kevd637/apache-website:v1

    ports:
      - "80:80"

    deploy:
      replicas: 3

      placement:
        constraints:
          - node.labels.workload == application

      restart_policy:
        condition: on-failure

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s